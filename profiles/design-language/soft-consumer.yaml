# Design-language profile — "soft-consumer": rounded, seamless, monochrome
# Calibration point opposite to te-like. Muji / Braun-household / Apple-accessory register.

meta:
  id: soft-consumer
  name: soft rounded consumer object
  intent: >
    An object that wants to be held: one continuous shell, generous plan-view corners,
    edges rolled into fillets, no visible construction. One colour, no labels unless legally
    required, no decoration. It refuses sharpness, refuses visible screws, refuses accents.
  references: [Muji household electronics, Braun kitchen objects 1970–90, current white-goods accessories]   # estimated

edges:
  policy: fillet
  edge_treatment: {type: fillet, size: 3.0}
  outer_corner_radius: 10.0
  radius_family: [3.0, 6.0, 12.0]
  max_radius: 20.0
  inner_corner_radius: 3.0
  bottom_edge: {type: chamfer, size: 0.5}     # the bed edge is hidden; a fillet here would start as a 90° overhang, so the process wins
  hierarchy: outer edges 3, plan corners 10–12, openings 1–3

proportions:
  grid: 0.0                                   # proportion-driven, no visible grid
  sub_grid: 0.0
  control_pitch: 0.0
  preferred_aspect_ratios: ["1:1", "4:3", "golden"]
  plate_thickness: 2.0
  layering: [shell]                           # single visible volume; splits hidden in a reveal on the underside
  reveal: {width: 0.0, depth: 0.0}
  nesting_offset: 0.0
  snap_positions_to_grid: false

surfaces:
  finish: matte or satin
  texture_zones: []
  visible_face_rule: cosmetic faces vertical; top surfaces at 0.12 mm layers or ironed
  parting_lines: hidden                       # on the underside or inside a fillet

fasteners:
  visible: false
  type: M3 countersunk from below, or snap-fit (PETG)
  pattern: {rule: from the underside only}
  method: heat-set inserts in the base
  head_treatment: countersunk, covered by TPU feet if possible

color:
  base: [RAL 9010 pure white, RAL 7044 silk grey, RAL 9011 graphite black]
  accents: []
  max_colors_per_object: 1
  accent_rule: none
  semantics: {}
  filament_map: {RAL 9010: Bambu PLA Matte Ivory White (near), RAL 7044: Bambu PLA Matte Ash Gray (near), RAL 9011: Bambu PLA Matte Charcoal (near)}   # verify names

typography:
  font: light grotesk
  case: lowercase
  method: debossed
  min_height: 5.0
  placement: underside only
  density: none

controls:
  knob_cap: {shape: dome, dia: 20.0, height: 10.0, top: domed, chamfer: 0.0, fillet: 3.0, shaft: D 6.0, color: base}
  button: {footprint: 12.0, corner_radius: 6.0, gap_to_bezel: 0.3, pitch: 0.0, material: TPU cap}
  display: {mount: recessed 0.5, bezel: base colour, window_corner_radius: 3.0}
  ports: recessed, edges filleted 1.0

grilles:
  pattern: {type: slots, w: 1.5, l: 12.0, pitch: 3.0}
  alignment: hidden on underside or rear
  edge_margin: 3.0

feet_and_handles:
  feet: TPU pads Ø10 × 2 covering the screw heads
  handles: none

signature:
  playfulness: none
  element_examples: []
  humour_in_labels: false

anti_patterns:
  - visible screws, exposed inserts, visible seams on side faces
  - chamfers anywhere (reads technical)
  - radii below 3 mm on outer edges
  - more than one colour
  - labels on visible faces
  - flat top faces with staircase layer lines (orient or 0.12 mm)
